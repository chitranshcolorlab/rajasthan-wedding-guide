<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor Review Admin | Rajasthan Wedding Guide</title><meta name="robots" content="noindex,nofollow"><style>*{box-sizing:border-box}body{margin:0;background:#f4efe6;color:#171717;font-family:Arial,sans-serif}header{background:#090909;color:#fff;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-family:Georgia,serif;font-size:24px;font-weight:700}.brand span{color:#c7a15a}.wrap{max-width:1200px;margin:auto;padding:42px 5%}.notice{background:#fff4d6;border-left:4px solid #c7a15a;padding:16px;line-height:1.6;margin-bottom:18px}.result{display:none;padding:14px 16px;border-radius:10px;margin-bottom:18px;font-weight:700}.result.wait{display:block;background:#eaf2ff;color:#174a8b}.result.ok{display:block;background:#e8f7ed;color:#176536}.result.bad{display:block;background:#fdeaea;color:#8d2222}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.filter{border:1px solid #ccc;background:#fff;padding:10px 15px;border-radius:22px;cursor:pointer}.filter.active{background:#111;color:#e0c78e}.card{background:#fff;border-radius:18px;padding:25px;box-shadow:0 8px 28px #0000000d;margin-bottom:18px}.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.status{font-size:11px;font-weight:800;padding:7px 11px;border-radius:20px;background:#fff0c9;color:#76570d}.meta{color:#777;line-height:1.7;margin:10px 0 18px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{background:#f8f5ef;border-radius:10px;padding:12px;overflow-wrap:anywhere}.field b{display:block;font-size:11px;color:#8a6528;margin-bottom:5px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.btn{border:0;padding:12px 17px;border-radius:25px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.approve{background:#1d6b3b;color:#fff}.edit{background:#c7a15a;color:#111}.reject{background:#9b2c2c;color:#fff}.preview{background:#111;color:#e0c78e}.empty{text-align:center;padding:45px;color:#777}.modal{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;padding:20px;z-index:1000}.box{background:#fff;width:min(600px,100%);border-radius:18px;padding:25px;max-height:90vh;overflow:auto}.box textarea{width:100%;min-height:120px;padding:12px;margin:12px 0;border:1px solid #ccc;border-radius:10px}.box .row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}.small{font-size:12px;color:#777;margin-top:8px}.profileBox{width:min(1000px,100%)}.profileHead{display:flex;gap:18px;align-items:center;margin-bottom:20px}.logo{width:90px;height:90px;border-radius:14px;object-fit:cover;background:#f4efe6}.profileGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.profileField{background:#f8f5ef;border-radius:10px;padding:13px;white-space:pre-wrap;overflow-wrap:anywhere}.profileField b{display:block;color:#8a6528;font-size:11px;margin-bottom:5px}.wide{grid-column:1/-1}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}.photos img{width:100%;height:170px;object-fit:cover;border-radius:12px}.closeX{float:right;border:0;background:#111;color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;font-size:18px}.link{color:#8a6528;word-break:break-all}@media(max-width:750px){.grid,.profileGrid{grid-template-columns:1fr}.top{display:block}.status{display:inline-block;margin-top:10px}.photos{grid-template-columns:1fr 1fr}.wide{grid-column:auto}.profileHead{align-items:flex-start}}</style></head><body><header><div class="brand">Rajasthan <span>Wedding Guide</span> — Admin Review</div><a href="index.html" style="color:#e0c78e">View Site</a></header><main class="wrap"><div class="notice"><b>Publishing rule:</b> New submissions remain <b>Pending Approval</b>. Only approved vendors should move forward for publishing.</div><div id="result" class="result"></div><div class="toolbar"><button class="filter active" data-filter="Pending Approval">Pending Approval</button><button class="filter" data-filter="Edit Required">Edit Required</button><button class="filter" data-filter="Approved">Approved</button><button class="filter" data-filter="Rejected">Rejected</button><button class="filter" id="refresh">Refresh</button></div><div id="list"><div class="empty">Loading submissions...</div></div></main><div class="modal" id="modal"><div class="box"><h2 id="modalTitle">Review Note</h2><p id="modalText"></p><textarea id="reviewNote" placeholder="Write reason / correction required for vendor..."></textarea><div class="row"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn edit" id="confirmAction">Confirm</button></div></div></div><div class="modal" id="previewModal"><div class="box profileBox"><button class="closeX" onclick="closePreview()">×</button><div id="previewContent"></div></div></div><script>
const WEB_APP_URL='https://script.google.com/macros/s/AKfycbypaeQYiXo3PWRul5n5VFGEiAKBnAnuEtBepQ-s-TC9ZqJG6f3sfSSDBj6e97FEWrN7DA/exec';
let data=[],currentFilter='Pending Approval',currentId=null,currentAction=null,busy=false;
const pick=(o,...keys)=>{for(const k of keys)if(o[k]!==undefined&&o[k]!==null)return o[k];return''};
function norm(x){return{id:pick(x,'Submission ID','id'),business:pick(x,'Business Name','businessName','business'),owner:pick(x,'Owner Name','ownerName','owner'),mobile:pick(x,'Mobile','mobile'),whatsapp:pick(x,'WhatsApp','whatsapp'),email:pick(x,'Email','email'),experience:pick(x,'Years in Business','experience'),category:pick(x,'Category','category'),city:pick(x,'City','city'),address:pick(x,'Full Address','address'),serviceAreas:pick(x,'Service Areas','serviceAreas'),maps:pick(x,'Google Maps','maps'),about:pick(x,'About Business','about'),services:pick(x,'Services','services'),startingPrice:pick(x,'Starting Price','startingPrice'),languages:pick(x,'Languages','languages'),specialities:pick(x,'Specialities','specialities'),instagram:pick(x,'Instagram','instagram'),website:pick(x,'Website','website'),facebook:pick(x,'Facebook','facebook'),portfolio:pick(x,'Portfolio Link','portfolio'),logo:pick(x,'Logo URL','logo'),photos:pick(x,'Photo URLs','photos'),submitted:pick(x,'Registration Date','submitted'),status:pick(x,'Status','status')||'Pending Approval',reviewNote:pick(x,'Review Notes','reviewNote')}}
function showResult(type,msg){const e=document.getElementById('result');e.className='result '+type;e.textContent=msg;e.scrollIntoView({behavior:'smooth',block:'nearest'})}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
async function fetchItems(){const r=await fetch(WEB_APP_URL+'?action=list&_='+Date.now(),{cache:'no-store'});const j=await r.json();if(!j.ok)throw new Error(j.error||'Could not load');return(j.items||[]).map(norm)}
async function load(){const list=document.getElementById('list');list.innerHTML='<div class="empty">Loading submissions...</div>';try{data=await fetchItems();render()}catch(e){console.error(e);list.innerHTML='<div class="empty">Could not load Google Sheet data.</div>';showResult('bad','Could not read Google Sheet: '+e.message)}}
function render(){const list=document.getElementById('list');list.innerHTML='';const rows=data.filter(x=>x.status===currentFilter);if(!rows.length){list.innerHTML='<div class="empty">No submissions in this status.</div>';return}rows.forEach(v=>{const el=document.createElement('article');el.className='card';el.innerHTML=`<div class="top"><div><h2>${esc(v.business)}</h2><div class="meta">Submission ID: ${esc(v.id)} • ${esc(v.city)} • ${esc(v.category)}</div></div><span class="status">${esc(v.status)}</span></div><div class="grid"><div class="field"><b>OWNER</b>${esc(v.owner)||'—'}</div><div class="field"><b>MOBILE</b>${esc(v.mobile)||'—'}</div><div class="field"><b>SERVICES</b>${esc(v.services)||'—'}</div></div><div class="actions"><button class="btn preview" onclick="preview('${escAttr(v.id)}')">Preview</button>${v.status!=='Approved'?`<button class="btn approve" onclick="approve('${escAttr(v.id)}')">Approve</button>`:''}${v.status!=='Edit Required'?`<button class="btn edit" onclick="openAction('${escAttr(v.id)}','Edit Required')">Edit Required</button>`:''}${v.status!=='Rejected'?`<button class="btn reject" onclick="openAction('${escAttr(v.id)}','Rejected')">Reject</button>`:''}</div>`;list.appendChild(el)})}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function escAttr(s){return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}function safeUrl(s){const u=String(s||'').trim();return /^https?:\/\//i.test(u)?u:''}function f(label,value,wide=false){return `<div class="profileField${wide?' wide':''}"><b>${esc(label)}</b>${value?esc(value):'—'}</div>`}function linkf(label,value){const u=safeUrl(value);return `<div class="profileField"><b>${esc(label)}</b>${u?`<a class="link" href="${esc(u)}" target="_blank" rel="noopener">${esc(value)}</a>`:(value?esc(value):'—')}</div>`}
async function postStatus(body){console.log('[RWG] POST BODY',body);const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),8000);try{await fetch(WEB_APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),signal:controller.signal});console.log('[RWG] POST completed')}catch(e){if(e.name==='AbortError')console.warn('[RWG] POST timed out; continuing verification');else throw e}finally{clearTimeout(timer)}}
async function setStatus(id,status,note){if(busy)return false;busy=true;const body={action:'status',id:String(id),status:String(status),note:note||''};showResult('wait','Sending '+status+' for '+id+'…');try{await postStatus(body);showResult('wait','Request sent. Verifying Google Sheet…');for(let attempt=1;attempt<=8;attempt++){await wait(1000);const fresh=await fetchItems();const found=fresh.find(x=>String(x.id)===String(id));console.log('[RWG] VERIFY',attempt,found);if(found&&found.status===status){data=fresh;render();showResult('ok','✓ VERIFIED: '+id+' is now '+status+' in Google Sheet.');return true}}showResult('bad','✗ NOT UPDATED: Google Sheet still did not change for '+id+'. This confirms the problem is in the Apps Script status endpoint/deployment, not this button.');return false}catch(e){console.error('[RWG] STATUS ERROR',e);showResult('bad','✗ ERROR: '+e.message);return false}finally{busy=false}}
async function approve(id){if(!confirm('Approve this vendor?'))return;const ok=await setStatus(id,'Approved','Approved by admin');if(ok)closePreview()}
function openAction(id,action){currentId=id;currentAction=action;document.getElementById('modalTitle').textContent=action;document.getElementById('modalText').textContent=action==='Edit Required'?'Tell the vendor exactly what must be corrected before approval.':'Add the rejection reason for the admin record.';document.getElementById('reviewNote').value='';document.getElementById('modal').style.display='flex'}function closeModal(){document.getElementById('modal').style.display='none'}
document.getElementById('confirmAction').onclick=async()=>{const note=document.getElementById('reviewNote').value.trim();if(!note){alert('Please add a review note.');return}const ok=await setStatus(currentId,currentAction,note);if(ok){closeModal();closePreview()}};
function preview(id){const v=data.find(x=>x.id===id);if(!v)return;currentId=id;const logo=safeUrl(v.logo);const photoUrls=String(v.photos||'').split(/\r?\n/).map(safeUrl).filter(Boolean);document.getElementById('previewContent').innerHTML=`<div class="profileHead">${logo?`<img class="logo" src="${esc(logo)}" alt="Logo">`:''}<div><h2 style="margin:0 0 6px">${esc(v.business)||'Vendor Profile'}</h2><div class="meta" style="margin:0">${esc(v.category)}${v.city?' • '+esc(v.city):''}</div><span class="status">${esc(v.status)}</span></div></div><div class="profileGrid">${f('Submission ID',v.id)}${f('Registration Date',v.submitted)}${f('Owner Name',v.owner)}${f('Mobile',v.mobile)}${f('WhatsApp',v.whatsapp)}${f('Email',v.email)}${f('Years in Business',v.experience)}${f('Starting Price',v.startingPrice)}${f('Full Address',v.address,true)}${f('Service Areas',v.serviceAreas,true)}${f('About Business',v.about,true)}${f('Services',v.services,true)}${f('Languages',v.languages)}${f('Specialities',v.specialities)}${linkf('Google Maps',v.maps)}${linkf('Instagram',v.instagram)}${linkf('Website',v.website)}${linkf('Facebook',v.facebook)}${linkf('Portfolio',v.portfolio)}${f('Review Notes',v.reviewNote,true)}</div>${photoUrls.length?`<h3>Uploaded Photos</h3><div class="photos">${photoUrls.map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img src="${esc(u)}" alt="Vendor photo"></a>`).join('')}</div>`:''}<div class="actions"><button class="btn approve" onclick="approve('${escAttr(v.id)}')">Approve</button><button class="btn edit" onclick="openAction('${escAttr(v.id)}','Edit Required')">Edit Required</button><button class="btn reject" onclick="openAction('${escAttr(v.id)}','Rejected')">Reject</button><button class="btn" onclick="closePreview()">Close</button></div>`;document.getElementById('previewModal').style.display='flex'}function closePreview(){document.getElementById('previewModal').style.display='none'}
document.querySelectorAll('.filter[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentFilter=b.dataset.filter;render()});document.getElementById('refresh').onclick=load;document.getElementById('previewModal').addEventListener('click',e=>{if(e.target.id==='previewModal')closePreview()});document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});load();
</script></body></html>
