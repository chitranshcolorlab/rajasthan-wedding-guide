<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor Profile | Rajasthan Wedding Guide</title><meta name="description" content="Approved wedding vendor profile on Rajasthan Wedding Guide"><style>*{box-sizing:border-box}body{margin:0;background:#f7f3eb;color:#171717;font-family:Arial,sans-serif}a{text-decoration:none;color:inherit}header{background:#090909;color:#fff;padding:18px 6%;display:flex;justify-content:space-between;align-items:center}.logo{font-size:25px;font-weight:700}.logo span{color:#c7a15a}.back{color:#e0c78e}.hero{background:#111;color:#fff;padding:54px 6%}.heroInner{max-width:1100px;margin:auto;display:flex;gap:24px;align-items:center}.heroLogo{width:125px;height:125px;border-radius:20px;object-fit:cover;background:#fff;border:3px solid #c7a15a}.badge{display:inline-block;background:#c7a15a;color:#111;padding:7px 12px;border-radius:20px;font-size:11px;font-weight:800}.hero h1{font-size:48px;margin:15px 0 8px}.meta{color:#bbb}.wrap{max-width:1100px;margin:auto;padding:45px 6%}.layout{display:grid;grid-template-columns:1.5fr .8fr;gap:25px}.card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 9px 28px #00000010;margin-bottom:22px}.card h2{font-size:27px;margin:0 0 18px}.text{white-space:pre-line;color:#555;line-height:1.75}.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fact{background:#f8f4ed;padding:13px;border-radius:10px;overflow-wrap:anywhere}.fact b{display:block;font-size:11px;color:#8a6528;margin-bottom:5px}.buttons{display:grid;gap:10px}.btn{display:block;text-align:center;padding:13px;border-radius:28px;font-weight:700;background:#111;color:#e0c78e}.gold{background:#c7a15a;color:#111}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#eee}.loading,.error{text-align:center;padding:70px 20px;color:#999}.empty{color:#888;font-style:italic}.price{font-size:25px;font-weight:800;color:#8a6528}.categoryLink{display:inline-block;margin-top:14px;color:#e0c78e;font-size:13px}@media(max-width:760px){.layout{grid-template-columns:1fr}.heroInner{align-items:flex-start}.heroLogo{width:90px;height:90px}.hero h1{font-size:34px}.facts{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.heroInner{display:block}.heroLogo{margin-bottom:18px}}</style></head><body><header><a class="logo" href="index.html">Rajasthan <span>Wedding Guide</span></a><a class="back" href="categories.html">Categories</a></header><section class="hero" id="hero"><div class="loading">Loading approved vendor...</div></section><main class="wrap" id="main"></main><script>const API='https://script.google.com/macros/s/AKfycbz8SfXfcYwH5giymrCmKOGf9w_kmXjXGBiQ6CtrI2Btl7K3zDja5xcLGOwSEtD-XwM8eg/exec';const id=new URLSearchParams(location.search).get('id');const pick=(o,...ks)=>{for(const k of ks)if(o&&o[k]!=null&&String(o[k]).trim()!=='')return o[k];return''};const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const norm=s=>String(s||'').trim().toLowerCase();function url(u){u=String(u||'').trim();if(!u)return'';if(/^https?:\/\//i.test(u))return u;if(/^(www\.)?[a-z0-9.-]+\.[a-z]{2,}(\/.*)?$/i.test(u))return'https://'+u;return''}function social(u,type){u=String(u||'').trim();if(!u)return'';if(/^https?:\/\//i.test(u))return u;u=u.replace(/^@/,'');if(type==='instagram')return'https://instagram.com/'+u;if(type==='facebook')return'https://facebook.com/'+u;return url(u)}function drive(u){const s=String(u||''),m=s.match(/\/d\/([^/]+)/)||s.match(/[?&]id=([^&]+)/);return m?'https://drive.google.com/thumbnail?id='+encodeURIComponent(m[1])+'&sz=w1600':url(s)}function phone(v){let n=String(v||'').replace(/\D/g,'');if(n.length===12&&n.startsWith('91'))n=n.slice(2);return n.length===10?n:''}function categoryUrl(c){return'vendors.html?category='+encodeURIComponent(c||'')}
async function load(){const hero=document.getElementById('hero'),main=document.getElementById('main');if(!id){hero.innerHTML='<div class="error">Vendor ID missing.</div>';return}try{const r=await fetch(API+'?action=list&_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(!j.ok)throw Error(j.error||'Load failed');const x=(j.items||[]).find(o=>String(pick(o,'Submission ID','id')).trim()===String(id).trim());if(!x){hero.innerHTML='<div class="error">This vendor profile could not be found.</div>';return}if(norm(pick(x,'Status','status'))!=='approved'){hero.innerHTML='<div class="error">This vendor profile is not approved.</div>';return}const v={business:pick(x,'Business Name','businessName'),owner:pick(x,'Owner Name','ownerName'),mobile:pick(x,'Mobile','mobile'),whatsapp:pick(x,'WhatsApp','whatsapp'),email:pick(x,'Email','email'),experience:pick(x,'Years in Business','Experience','experience'),category:pick(x,'Category','category'),district:pick(x,'District','district'),city:pick(x,'City','city'),address:pick(x,'Full Address','Address','address'),areas:pick(x,'Service Areas','serviceAreas'),maps:pick(x,'Google Maps','Google Maps / Business Link','Maps','maps'),about:pick(x,'About Business','About','about'),services:pick(x,'Services','services'),price:pick(x,'Starting Price','startingPrice'),languages:pick(x,'Languages','languages'),specialities:pick(x,'Specialities','specialities'),instagram:pick(x,'Instagram','instagram'),website:pick(x,'Website','website'),facebook:pick(x,'Facebook','facebook'),portfolio:pick(x,'Portfolio Link','Portfolio','portfolio'),logo:pick(x,'Logo URL','logoUrl'),photos:pick(x,'Photo URLs','photoUrls')};document.title=(v.business||'Wedding Vendor')+' | Rajasthan Wedding Guide';const desc=(v.business||'Wedding vendor')+' - '+(v.category||'wedding services')+(v.city?' in '+v.city+(v.district?' ('+v.district+')':'')+', Rajasthan':'')+'. View services, contact details and portfolio.';document.querySelector('meta[name="description"]').setAttribute('content',desc);const photos=String(v.photos||'').split(/[\n,]+/).map(s=>s.trim()).filter(Boolean),logo=drive(v.logo),wa=phone(v.whatsapp||v.mobile),mob=phone(v.mobile),site=url(v.website),insta=social(v.instagram,'instagram'),fb=social(v.facebook,'facebook'),maps=url(v.maps),portfolio=url(v.portfolio);hero.innerHTML='<div class="heroInner">'+(logo?'<img class="heroLogo" src="'+esc(logo)+'" alt="'+esc(v.business)+' logo">':'')+'<div><span class="badge">APPROVED VENDOR</span><h1>'+esc(v.business||'Wedding Professional')+'</h1><div class="meta">'+esc(v.category||'Wedding Vendor')+(v.district?' • '+esc(v.district):'')+(v.city?' • '+esc(v.city)+', Rajasthan':'')+'</div><a class="categoryLink" href="'+esc(categoryUrl(v.category))+'">View more '+esc(v.category||'vendors')+' →</a></div></div>';main.innerHTML=`<div class="layout"><div><section class="card"><h2>About ${esc(v.business||'Business')}</h2><div class="text ${v.about?'':'empty'}">${esc(v.about||'Business details will be updated soon.')}</div></section><section class="card"><h2>Services</h2><div class="text ${v.services?'':'empty'}">${esc(v.services||'Service details will be updated soon.')}</div></section>${v.specialities?'<section class="card"><h2>Specialities</h2><div class="text">'+esc(v.specialities)+'</div></section>':''}${photos.length?'<section class="card"><h2>Photos</h2><div class="gallery">'+photos.map((p,i)=>'<img loading="lazy" src="'+esc(drive(p))+'" alt="'+esc(v.business)+' portfolio photo '+(i+1)+'">').join('')+'</div></section>':''}</div><aside>${v.price?'<section class="card"><h2>Starting Price</h2><div class="price">'+esc(v.price)+'</div></section>':''}<section class="card"><h2>Business Details</h2><div class="facts">${v.district?'<div class="fact"><b>DISTRICT</b>'+esc(v.district)+'</div>':''}${v.city?'<div class="fact"><b>CITY / TOWN</b>'+esc(v.city)+'</div>':''}${v.owner?'<div class="fact"><b>CONTACT PERSON</b>'+esc(v.owner)+'</div>':''}${v.experience?'<div class="fact"><b>EXPERIENCE</b>'+esc(v.experience)+'</div>':''}${v.languages?'<div class="fact"><b>LANGUAGES</b>'+esc(v.languages)+'</div>':''}${v.areas?'<div class="fact"><b>SERVICE AREAS</b>'+esc(v.areas)+'</div>':''}${v.address?'<div class="fact"><b>ADDRESS</b>'+esc(v.address)+'</div>':''}${v.email?'<div class="fact"><b>EMAIL</b>'+esc(v.email)+'</div>':''}</div></section><section class="card"><h2>Contact & Links</h2><div class="buttons">${wa?'<a class="btn gold" href="https://wa.me/91'+esc(wa)+'?text='+encodeURIComponent('Hello '+(v.business||'')+', I found your profile on Rajasthan Wedding Guide.')+'" target="_blank" rel="noopener">WhatsApp Enquiry</a>':''}${mob?'<a class="btn" href="tel:+91'+esc(mob)+'">Call Now</a>':''}${insta?'<a class="btn" href="'+esc(insta)+'" target="_blank" rel="noopener">Instagram</a>':''}${maps?'<a class="btn" href="'+esc(maps)+'" target="_blank" rel="noopener">Google Maps</a>':''}${site?'<a class="btn" href="'+esc(site)+'" target="_blank" rel="noopener">Website</a>':''}${fb?'<a class="btn" href="'+esc(fb)+'" target="_blank" rel="noopener">Facebook</a>':''}${portfolio?'<a class="btn" href="'+esc(portfolio)+'" target="_blank" rel="noopener">Portfolio</a>':''}</div></section></aside></div>`}catch(e){console.error(e);hero.innerHTML='<div class="error"><b>Vendor data connection is temporarily unavailable.</b><br>Please refresh this page in a moment.</div>'}}load();</script></body></html>
