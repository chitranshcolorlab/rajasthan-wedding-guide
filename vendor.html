<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor Profile | Rajasthan Wedding Guide</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f3eb;color:#171717;font-family:Arial,sans-serif}a{text-decoration:none;color:inherit}header{background:#090909;color:#fff;padding:18px 6%;display:flex;justify-content:space-between}.logo{font-size:25px;font-weight:700}.logo span{color:#c7a15a}.back{color:#e0c78e}.hero{background:#111;color:#fff;padding:60px 6%}.hero .badge{display:inline-block;background:#c7a15a;color:#111;padding:7px 12px;border-radius:20px;font-size:11px;font-weight:800}.hero h1{font-size:48px;margin:15px 0 8px}.hero .meta{color:#bbb}.wrap{max-width:1100px;margin:auto;padding:45px 6%}.layout{display:grid;grid-template-columns:1.5fr .8fr;gap:25px}.card{background:#fff;border-radius:18px;padding:28px;box-shadow:0 9px 28px #00000010;margin-bottom:22px}.card h2{font-size:27px;margin-top:0}.text{white-space:pre-line;color:#555;line-height:1.75}.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fact{background:#f8f4ed;padding:13px;border-radius:10px}.fact b{display:block;font-size:11px;color:#8a6528}.buttons{display:grid;gap:10px}.btn{display:block;text-align:center;padding:13px;border-radius:28px;font-weight:700;background:#111;color:#e0c78e}.gold{background:#c7a15a;color:#111}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}.logoimg{width:120px;height:120px;object-fit:cover;border-radius:18px}.loading,.error{text-align:center;padding:70px 20px;color:#999}@media(max-width:760px){.layout{grid-template-columns:1fr}.hero h1{font-size:37px}.facts{grid-template-columns:1fr}}</style></head><body><header><a class="logo" href="index.html">Rajasthan <span>Wedding Guide</span></a><a class="back" href="categories.html">Categories</a></header><section class="hero" id="hero"><div class="loading">Loading approved vendor...</div></section><main class="wrap" id="main"></main><script>const API='https://script.google.com/macros/s/AKfycbypaeQYiXo3PWRul5n5VFGEiAKBnAnuEtBepQ-s-TC9ZqJG6f3sfSSDBj6e97FEWrN7DA/exec';const id=new URLSearchParams(location.search).get('id');const pick=(o,...ks)=>{for(const k of ks)if(o&&o[k]!=null)return o[k];return''};const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const safe=u=>/^https?:\/\//i.test(String(u||''))?String(u):'';const norm=s=>String(s||'').trim().toLowerCase();function drive(u){const s=String(u||''),m=s.match(/\/d\/([^/]+)/)||s.match(/[?&]id=([^&]+)/);return m?'https://drive.google.com/thumbnail?id='+encodeURIComponent(m[1])+'&sz=w1200':safe(s)}async function load(){const hero=document.getElementById('hero'),main=document.getElementById('main');if(!id){hero.innerHTML='<div class="error">Vendor ID missing.</div>';return}try{const r=await fetch(API+'?action=list&_='+Date.now(),{cache:'no-store'}),j=await r.json();if(!j.ok)throw Error(j.error||'Load failed');const x=(j.items||[]).find(o=>String(pick(o,'Submission ID','id')).trim()===String(id).trim());if(!x){hero.innerHTML='<div class="error">This vendor profile could not be found.</div>';return}if(norm(pick(x,'Status','status'))!=='approved'){hero.innerHTML='<div class="error">This vendor profile is not approved.</div>';return}const v={business:pick(x,'Business Name','businessName'),owner:pick(x,'Owner Name','ownerName'),mobile:pick(x,'Mobile','mobile'),whatsapp:pick(x,'WhatsApp','whatsapp'),email:pick(x,'Email','email'),experience:pick(x,'Years in Business','Experience','experience'),category:pick(x,'Category','category'),city:pick(x,'City','city'),address:pick(x,'Full Address','Address','address'),areas:pick(x,'Service Areas','serviceAreas'),maps:pick(x,'Google Maps','Google Maps / Business Link','Maps','maps'),about:pick(x,'About Business','About','about'),services:pick(x,'Services','services'),price:pick(x,'Starting Price','startingPrice'),languages:pick(x,'Languages','languages'),specialities:pick(x,'Specialities','specialities'),instagram:pick(x,'Instagram','instagram'),website:pick(x,'Website','website'),facebook:pick(x,'Facebook','facebook'),portfolio:pick(x,'Portfolio Link','Portfolio','portfolio'),logo:pick(x,'Logo URL','logoUrl'),photos:pick(x,'Photo URLs','photoUrls')};document.title=(v.business||'Vendor')+' | Rajasthan Wedding Guide';hero.innerHTML='<span class="badge">APPROVED VENDOR</span><h1>'+esc(v.business)+'</h1><div class="meta">'+esc(v.category)+' • '+esc(v.city)+(v.city?', Rajasthan':'')+'</div>';const photos=String(v.photos||'').split(/[\n,]+/).map(s=>s.trim()).filter(Boolean),logo=drive(v.logo),wa=String(v.whatsapp||v.mobile).replace(/\D/g,'').replace(/^91(?=\d{10}$)/,'');main.innerHTML=`<div class="layout"><div><section class="card">${logo?'<img class="logoimg" src="'+esc(logo)+'" alt="">':''}<h2>About</h2><div class="text">${esc(v.about||'Profile information coming soon.')}</div></section><section class="card"><h2>Services</h2><div class="text">${esc(v.services||'Services information coming soon.')}</div></section>${v.specialities?'<section class="card"><h2>Specialities</h2><div class="text">'+esc(v.specialities)+'</div></section>':''}${photos.length?'<section class="card"><h2>Portfolio</h2><div class="gallery">'+photos.map(p=>'<img loading="lazy" src="'+esc(drive(p))+'" alt="">').join('')+'</div></section>':''}</div><aside><section class="card"><h2>Business Details</h2><div class="facts">${v.owner?'<div class="fact"><b>CONTACT PERSON</b>'+esc(v.owner)+'</div>':''}${v.experience?'<div class="fact"><b>EXPERIENCE</b>'+esc(v.experience)+'</div>':''}${v.price?'<div class="fact"><b>STARTING PRICE</b>'+esc(v.price)+'</div>':''}${v.languages?'<div class="fact"><b>LANGUAGES</b>'+esc(v.languages)+'</div>':''}${v.areas?'<div class="fact"><b>SERVICE AREAS</b>'+esc(v.areas)+'</div>':''}${v.address?'<div class="fact"><b>ADDRESS</b>'+esc(v.address)+'</div>':''}</div></section><section class="card"><h2>Contact & Links</h2><div class="buttons">${wa?'<a class="btn gold" href="https://wa.me/91'+esc(wa)+'" target="_blank">WhatsApp</a>':''}${v.mobile?'<a class="btn" href="tel:'+esc(String(v.mobile).replace(/[^\d+]/g,''))+'">Call</a>':''}${safe(v.website)?'<a class="btn" href="'+esc(safe(v.website))+'" target="_blank">Website</a>':''}${safe(v.instagram)?'<a class="btn" href="'+esc(safe(v.instagram))+'" target="_blank">Instagram</a>':''}${safe(v.facebook)?'<a class="btn" href="'+esc(safe(v.facebook))+'" target="_blank">Facebook</a>':''}${safe(v.portfolio)?'<a class="btn" href="'+esc(safe(v.portfolio))+'" target="_blank">Portfolio</a>':''}${safe(v.maps)?'<a class="btn" href="'+esc(safe(v.maps))+'" target="_blank">Google Maps</a>':''}</div></section></aside></div>`}catch(e){console.error(e);hero.innerHTML='<div class="error"><b>Vendor data connection is temporarily unavailable.</b><br>Please refresh this page in a moment.</div>'}}load();</script></body></html>
