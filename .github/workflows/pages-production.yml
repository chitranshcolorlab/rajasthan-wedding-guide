name: Deploy production website
on:
  workflow_dispatch:
  push:
    branches: [main]
  workflow_run:
    workflows: [Publish approved production vendors]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: production-pages
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.repository == 'chitranshcolorlab/rajasthan-wedding-guide' &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.source.outputs.needed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Skip unchanged live source
        id: source
        run: |
          node <<'JS'
          const fs=require('node:fs'),{execFileSync}=require('node:child_process');
          (async()=>{
            const sha=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
            let needed=true;
            try{
              const r=await fetch('https://rajasthanweddingguide.com/production-build.json?source='+sha,{signal:AbortSignal.timeout(20000)});
              if(r.ok){const j=await r.json();needed=j.environment!=='production'||j.sourceCommit!==sha;}
            }catch{}
            fs.appendFileSync(process.env.GITHUB_OUTPUT,'needed='+needed+'\n');
          })().catch(e=>{console.error(e.message);process.exitCode=1});
          JS
      - name: Stage public website only
        if: steps.source.outputs.needed == 'true'
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,shutil,subprocess,os
          root=pathlib.Path('.');out=root/'_site';out.mkdir()
          extensions={'.html','.json','.xml','.txt','.webp','.png','.jpg','.jpeg','.svg','.gif','.mp4','.webm','.css','.js','.ico','.woff','.woff2'}
          for p in root.iterdir():
            if p.is_file() and (p.suffix.lower() in extensions or p.name=='CNAME'):shutil.copy2(p,out/p.name)
          for name in ('rajasthan','vendors','assets'):
            if (root/name).is_dir():shutil.copytree(root/name,out/name)
          required=('index.html','vendor-register.html','admin-review.html','robots.txt','sitemap.xml')
          for name in required:assert (out/name).is_file(),name
          assert not list(out.rglob('*.gs'))
          assert not (out/'backend').exists() and not (out/'tests').exists()
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          evidence={'environment':'production','sourceCommit':commit,'deploymentRun':os.environ['GITHUB_RUN_ID']}
          if (out/'approved-vendors.json').exists():evidence['catalogSha256']=hashlib.sha256((out/'approved-vendors.json').read_bytes()).hexdigest()
          (out/'production-build.json').write_text(json.dumps(evidence,indent=2)+'\n')
          PY
      - uses: actions/upload-pages-artifact@v3
        if: steps.source.outputs.needed == 'true'
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
