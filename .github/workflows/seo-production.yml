name: Safe Rajasthan SEO Production Build
on:
  push:
    paths:
      - 'scripts/generate-seo.js'
      - 'scripts/validate-seo.js'
      - 'scripts/fetch-approved-seo.js'
      - '.github/workflows/seo-production.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch approved vendor SEO combinations
        run: node scripts/fetch-approved-seo.js
      - name: Generate production SEO pages safely
        env:
          SEO_MODE: production
        run: node scripts/generate-seo.js
      - name: Validate all generated SEO pages
        run: node scripts/validate-seo.js
      - name: Commit only Rajasthan SEO pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rajasthan sitemap-seo.xml approved-seo.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Deploy validated Rajasthan SEO pages safely"
          git push
