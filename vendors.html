<!doctype html><html lang="en-IN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wedding Vendors | Rajasthan Wedding Guide</title><meta name="description" content="Browse approved Rajasthan Wedding Guide vendors by category and city."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;background:#f7f3eb;color:#171717}a{text-decoration:none;color:inherit}header{background:#0b0b0b;color:#fff;padding:18px 6%;display:flex;justify-content:space-between}.logo{font:700 25px 'Playfair Display',serif}.logo span{color:#c7a15a}.hero{background:#101010;color:#fff;padding:65px 6%;text-align:center}.hero h1{font:700 46px 'Playfair Display',serif;margin:10px}.hero p{color:#bbb}.wrap{max-width:1150px;margin:auto;padding:50px 6%}.filters{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:32px}.filters select{width:100%;padding:14px;border:1px solid #d4c7b0;border-radius:12px;background:#fff;font:inherit}.summary{margin-bottom:22px;color:#76571f;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:22px}.card{background:#fff;border-radius:18px;padding:26px;box-shadow:0 10px 30px #00000012}.badge{display:inline-block;background:#c7a15a;padding:6px 10px;border-radius:20px;font-size:11px;font-weight:700}.card h2{font:700 26px 'Playfair Display',serif;margin:15px 0 7px}.meta{color:#777;margin-bottom:15px}.card p{color:#555;line-height:1.65}.btn{display:inline-block;margin-top:16px;background:#111;color:#e0c78e;padding:11px 16px;border-radius:24px;font-weight:700}.empty{text-align:center;background:#fff;padding:35px;border-radius:15px;color:#777}footer{background:#080808;color:#aaa;text-align:center;padding:28px;margin-top:45px}@media(max-width:650px){.filters{grid-template-columns:1fr}.hero h1{font-size:35px}}</style></head><body><header><a class="logo" href="/">Rajasthan <span>Wedding Guide</span></a><a href="categories.html" style="color:#e0c78e">Categories</a></header><section class="hero"><h1 id="title">Approved Wedding Vendors</h1><p>Only admin-approved vendor profiles are shown here.</p></section><main class="wrap"><div class="filters"><select id="category"><option value="">All Categories</option></select><select id="city"><option value="">All Cities</option></select></div><div class="summary" id="summary">Loading approved vendors...</div><div class="grid" id="vendors"></div></main><footer>© 2026 Rajasthan Wedding Guide. All Rights Reserved.</footer><script>const API='https://script.google.com/macros/s/AKfycbwHnON0Jq6QBDX1Fqh7PP1pUPx6ZxedsUQSOP1I9t7Asqcri5Cu6ZqoKWYhKilNfwQzUw/exec';const q=new URLSearchParams(location.search),cat=document.getElementById('category'),city=document.getElementById('city'),root=document.getElementById('vendors'),sum=document.getElementById('summary'),title=document.getElementById('title');let rows=[];const pick=(o,...ks)=>{for(const k of ks)if(o[k]!=null)return o[k];return''};const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function options(el,values,current){values.sort().forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;o.selected=v===current;el.appendChild(o)})}function render(){const c=cat.value,d=city.value;const list=rows.filter(v=>(!c||v.category===c)&&(!d||v.city.toLowerCase()===d.toLowerCase()));title.textContent=(c||'Wedding Vendors')+(d?' in '+d:'');sum.textContent=list.length+' approved vendor'+(list.length===1?'':'s')+(c?' • '+c:'')+(d?' • '+d:'');root.innerHTML=list.length?list.map(v=>`<article class="card"><span class="badge">APPROVED VENDOR</span><h2>${esc(v.business)}</h2><div class="meta">${esc(v.category)} • ${esc(v.city)}, Rajasthan</div><p>${esc(v.about||v.services||'Approved Rajasthan Wedding Guide vendor profile.')}</p><a class="btn" href="vendor.html?id=${encodeURIComponent(v.id)}">View Profile →</a></article>`).join(''):'<div class="empty">No approved vendors found for this category and city.</div>';history.replaceState(null,'','?'+new URLSearchParams(Object.fromEntries([['category',c],['city',d]].filter(x=>x[1]))).toString())}async function load(){try{const r=await fetch(API+'?action=list&_='+Date.now()),j=await r.json();if(!j.ok)throw Error(j.error||'Load failed');rows=(j.items||[]).map(x=>({id:pick(x,'Submission ID','id'),business:pick(x,'Business Name','businessName'),category:pick(x,'Category','category'),city:pick(x,'City','city'),about:pick(x,'About','about'),services:pick(x,'Services','services'),status:pick(x,'Status','status')})).filter(v=>String(v.status).trim()==='Approved');const cats=[...new Set(rows.map(v=>v.category).filter(Boolean))],cities=[...new Set(rows.map(v=>v.city).filter(Boolean))];options(cat,cats,q.get('category')||'');options(city,cities,q.get('city')||'');render()}catch(e){sum.textContent='Could not load vendors.';root.innerHTML='<div class="empty">Please refresh and try again.</div>'}}cat.onchange=render;city.onchange=render;load();</script></body></html>
